name: Update Missouri Lottery Results

on:
  schedule:
    - cron: "10,30,50 18-23 * * *"
    - cron: "10,30,50 0-4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-results-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

            - name: Install Python packages
        run: python -m pip install requests beautifulsoup4

      - name: Check Missouri Lottery results
        run: python scripts/update_results.py

      - name: Save new results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update Missouri lottery results"
            git push
          fi
